<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>__PROJECT__ Project Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one dark "cortex" canvas fills the screen; a glass header carries search and
   relation filters; a detail panel docks right (desktop) or rises from the bottom (phone). */
:root {
  color-scheme: dark;
  --void: #04050c;          /* page ground */
  --deep: #0a0e1f;          /* raised surfaces */
  --glass: rgba(10, 14, 31, 0.84);
  --line: rgba(130, 160, 255, 0.16);
  --ink: #e7ecff;           /* primary text */
  --ink-dim: #a0abd0;       /* secondary text */
  --ink-faint: #64709a;     /* captions */
  --synapse: #7cf0ff;       /* single accent: focus, selection */
  --k-imports: #5ad2ff;
  --k-calls: #b28cff;
  --k-types: #ffc46b;
  --k-tests: #78f7b0;
  --k-docs: #ff7ad6;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --panel-w: 372px;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.45; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--synapse); outline-offset: 2px; border-radius: 6px; }

/* Header */
header {
  position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, rgba(4,5,12,.96), rgba(4,5,12,.78));
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; text-wrap: balance; }
.brand h1 span { color: var(--synapse); font-weight: 500; }
.brand .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.search { position: relative; flex: 1 1 260px; max-width: 460px; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; padding: 9px 12px 9px 34px; border-radius: 10px;
  background: var(--deep); border: 1px solid var(--line); outline: none;
}
.search input:focus { border-color: var(--synapse); box-shadow: 0 0 0 3px rgba(124,240,255,.12); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--ink-faint); }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 6px; list-style: none;
  background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 12px;
  max-height: 60vh; overflow-y: auto; box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.results li button { width: 100%; text-align: left; display: grid; gap: 1px; padding: 7px 9px; border: 0; border-radius: 8px; background: none; }
.results li button[aria-selected="true"], .results li button:hover { background: rgba(124,240,255,.09); }
.results .r-name { font-family: var(--font-mono); font-size: 13px; }
.results .r-path { font-size: 11.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-mode { font-size: 11px; color: var(--synapse); padding: 4px 9px 6px; letter-spacing: .06em; text-transform: uppercase; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips .lbl { font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line); font-size: 12px; color: var(--ink-dim);
  transition: background .15s, color .15s, border-color .15s; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip b { font-weight: 500; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
.chip[aria-pressed="false"] i { box-shadow: none; opacity: .35; }
header > * { min-width: 0; }
.row2 { flex-basis: 100%; max-width: 100%; display: flex; gap: 10px 22px; flex-wrap: wrap; }
.row2 > * { min-width: 0; max-width: 100%; }
.folders { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: thin; padding-bottom: 2px; min-width: 0; max-width: 100%; }

/* Stage */
main { position: relative; min-height: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 4; padding: 6px 9px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--line); font-size: 12px; max-width: 260px;
  transform: translate(12px, 12px);
}
.tooltip .t-name { font-family: var(--font-mono); }
.tooltip .t-role { color: var(--ink-faint); }

.panel {
  position: absolute; z-index: 3; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: var(--panel-w);
  display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(16px);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.5); min-height: 0;
}
.panel .grab { display: none; }
.panel-body { overflow-y: auto; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.fname { margin: 2px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 18px; word-break: break-word; text-wrap: balance; }
.fpath { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); word-break: break-all; display: flex; gap: 6px; align-items: flex-start; }
.fpath button { border: 1px solid var(--line); background: none; border-radius: 6px; font-size: 11px; padding: 0 6px; color: var(--ink-faint); flex: none; }
.tagline { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-dim); }
.tag.g { color: var(--c); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
.purpose { margin: 0; color: var(--ink); max-width: 62ch; }
.purpose.none { color: var(--ink-faint); font-style: italic; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 1px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.025); border: 1px solid var(--line); }
.stat b { font-family: var(--font-mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-faint); }
.section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; display: flex; justify-content: space-between; }
.symbols { display: flex; flex-wrap: wrap; gap: 5px; }
.symbols code { font-family: var(--font-mono); font-size: 11.5px; padding: 2px 6px; border-radius: 5px; background: rgba(124,240,255,.06); color: var(--ink-dim); }
.conns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.conn { width: 100%; text-align: left; border: 1px solid transparent; background: rgba(255,255,255,.02); border-radius: 10px; padding: 8px 10px; display: grid; gap: 3px; }
.conn:hover, .conn:focus-visible { border-color: var(--line); background: rgba(124,240,255,.06); }
.conn .c-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.conn .c-name { font-family: var(--font-mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.conn .c-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); flex: none; }
.kinds { display: flex; gap: 4px; flex: none; }
.k { font-size: 10.5px; font-family: var(--font-mono); padding: 1px 6px; border-radius: 5px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.conn .c-why { font-size: 12px; color: var(--ink-dim); overflow-wrap: anywhere; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12px; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: rgba(124,240,255,.12); color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 9px; padding: 6px 11px; font-size: 12.5px; }
.btn:hover { border-color: var(--synapse); }
.btn.primary { border-color: color-mix(in srgb, var(--synapse) 60%, transparent); color: var(--synapse); }
.path-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.path-steps li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
.path-steps .n { font-family: var(--font-mono); font-size: 11px; color: var(--synapse); padding-top: 9px; text-align: right; }
.hint { font-size: 12.5px; color: var(--ink-dim); margin: 0; }
.hint kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.dock { position: absolute; z-index: 3; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.legend { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 11.5px; color: var(--ink-dim); display: grid; gap: 4px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.tools { display: flex; gap: 6px; }
.tools .btn { background: var(--glass); backdrop-filter: blur(12px); }

@media (max-width: 760px) {
  .brand h1 { font-size: 15px; }
  .search { flex-basis: 100%; max-width: none; }
  .row2 { gap: 8px; }
  .row2 .chips:not(.folders) { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; padding-bottom: 2px; }
  .panel { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: auto; max-height: 46%; border-radius: 16px 16px 12px 12px; }
  .panel.collapsed .panel-body { display: none; }
  .panel .grab { display: flex; justify-content: center; align-items: center; gap: 8px; border: 0; background: none; padding: 8px; font-size: 12px; color: var(--ink-faint); }
  .panel .grab::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  .legend { display: none; }
  .dock { bottom: auto; top: 10px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('graph-data').textContent);
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const KINDS = [
  { id: 'imports', label: 'Imports', color: tok('--k-imports') },
  { id: 'calls', label: 'Calls', color: tok('--k-calls') },
  { id: 'types', label: 'Types', color: tok('--k-types') },
  { id: 'tests', label: 'Tests', color: tok('--k-tests') },
  { id: 'docs', label: 'Docs', color: tok('--k-docs') },
];
const KIND = Object.fromEntries(KINDS.map(k => [k.id, k]));
const VERB = { imports: 'imports', calls: 'calls', types: 'uses types from', tests: 'tests', docs: 'documents' };
const PALETTE = ['#5ad2ff', '#b28cff', '#ff7ad6', '#ffc46b', '#78f7b0', '#7f9cff', '#ff9a74', '#4ff0d0', '#e0a8ff', '#c8f06e', '#ff6f9c', '#9fd4ff', '#f5e17a', '#8affd9'];
const GROUP_LABEL = { root: 'project root', src: 'app shell' };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k) { try { return localStorage.getItem('ng:' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('ng:' + k, v); } catch {} } };

// ---------- model ----------
const groups = DATA.groups.map((g, i) => ({ ...g, label: GROUP_LABEL[g.id] || g.id, color: PALETTE[i % PALETTE.length] }));
const G = Object.fromEntries(groups.map(g => [g.id, g]));
const nodes = DATA.files.map(f => ({ ...f, color: G[f.group].color, r: 4 + 2.3 * Math.sqrt(f.degree || 0), phase: Math.random() * 6.28 }));
const N = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = DATA.links.filter(l => N[l.s] && N[l.t]).map((l, i) => ({ ...l, source: l.s, target: l.t, idx: i, phase: Math.random() }));
const adj = new Map(nodes.map(n => [n.id, []]));
links.forEach(l => { adj.get(l.s).push(l); adj.get(l.t).push(l); });
const maxW = Math.max(1, ...links.map(l => l.w));
const pulseCut = links.map(l => l.w).sort((a, b) => b - a)[Math.floor(links.length * 0.22)] || 1;
const rankByDegree = [...nodes].sort((a, b) => b.degree - a.degree);
rankByDegree.forEach((n, i) => n.rank = i);

const state = {
  kinds: new Set(KINDS.map(k => k.id)), groups: new Set(groups.map(g => g.id)),
  selected: null, hover: null, hoverLink: null, focus: 0, trace: null, tracing: false,
  mode: reduceMotion ? 'off' : (['fire', 'calm', 'off'].includes(store.get('mode')) ? store.get('mode') : 'fire'),
  allLabels: store.get('labels') === 'all',
};

// ---------- layout: folders become lobes around an ellipse, ordered so linked lobes sit side by side ----------
(function layout() {
  const gw = {};
  links.forEach(l => { const a = N[l.s].group, b = N[l.t].group; if (a === b) return; const k = [a, b].sort().join('|'); gw[k] = (gw[k] || 0) + l.w; });
  const w = (a, b) => gw[[a, b].sort().join('|')] || 0;
  const order = [groups[0].id], left = new Set(groups.slice(1).map(g => g.id));
  while (left.size) {
    const last = order[order.length - 1];
    let best = null, bw = -1;
    left.forEach(g => { const v = w(last, g) + 0.01 * G[g].count; if (v > bw) { bw = v; best = g; } });
    order.push(best); left.delete(best);
  }
  const total = order.reduce((s, g) => s + Math.sqrt(G[g].count), 0);
  const scale = 140 + 34 * Math.sqrt(nodes.length);
  let acc = 0;
  order.forEach(g => {
    const share = Math.sqrt(G[g].count) / total;
    const a = -Math.PI / 2 + (acc + share / 2) * Math.PI * 2;
    acc += share;
    G[g].ax = Math.cos(a) * scale * 1.45; G[g].ay = Math.sin(a) * scale;
  });
  nodes.forEach(n => { const g = G[n.group]; n.x = g.ax + (Math.random() - .5) * 40; n.y = g.ay + (Math.random() - .5) * 40; });
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(l => (l.source.group === l.target.group ? 46 : 120))
      .strength(l => Math.min(.55, .06 + .025 * l.w) * (l.source.group === l.target.group ? 1 : .3)))
    .force('charge', d3.forceManyBody().strength(-170).distanceMax(420))
    .force('collide', d3.forceCollide(d => d.r + 12).iterations(2))
    .force('x', d3.forceX(d => G[d.group].ax).strength(d => d.degree ? .14 : .6))
    .force('y', d3.forceY(d => G[d.group].ay).strength(d => d.degree ? .14 : .6))
    .stop();
  for (let i = 0; i < 420; i++) sim.tick();
  links.forEach(l => { l.a = N[l.s]; l.b = N[l.t]; });
})();

// ---------- canvas ----------
const stage = document.getElementById('stage'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, T = d3.zoomIdentity;
const sprites = {};
function sprite(color) {
  if (sprites[color]) return sprites[color];
  const s = document.createElement('canvas'); s.width = s.height = 128;
  const c = s.getContext('2d'), g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, hexA(color, .9)); g.addColorStop(.18, hexA(color, .45)); g.addColorStop(.45, hexA(color, .12)); g.addColorStop(1, hexA(color, 0));
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  return (sprites[color] = s);
}
function hexA(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, m => m + m) : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function resize() {
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); draw();
}

// Visibility and emphasis
function nodeOn(n) { return state.groups.has(n.group) && (!focusSet || focusSet.has(n.id)); }
function linkOn(l) { return Object.keys(l.kinds).some(k => state.kinds.has(k)) && nodeOn(l.a) && nodeOn(l.b); }
let focusSet = null, active = null, activeLinks = null;
function recompute() {
  focusSet = null;
  if (state.selected && state.focus > 0) {
    focusSet = new Set([state.selected.id]); let frontier = [state.selected.id];
    for (let d = 0; d < state.focus; d++) {
      const next = [];
      frontier.forEach(id => adj.get(id).forEach(l => {
        if (!Object.keys(l.kinds).some(k => state.kinds.has(k))) return;
        const o = l.s === id ? l.t : l.s; if (!focusSet.has(o) && state.groups.has(N[o].group)) { focusSet.add(o); next.push(o); }
      }));

  while (q.length) {
    const id = q.shift(); if (id === b.id) break;
    adj.get(id).forEach(l => { if (!linkOn(l)) return; const o = l.s === id ? l.t : l.s; if (!prev.has(o)) { prev.set(o, { id, l }); q.push(o); } });
  }
  state.tracing = false;
  if (!prev.has(b.id)) { state.trace = null; renderPanel(); pbody.insertAdjacentHTML('afterbegin', `<p class="hint">No path from ${esc(a.name)} to ${esc(b.name)} with the current filters.</p>`); return; }
  const path = [], pl = []; let cur = b.id;
  while (cur) { path.unshift(cur); const p = prev.get(cur); if (p) pl.unshift(p.l); cur = p && p.id; }
  state.trace = { from: a, to: b, path, links: pl };
  recompute(); renderPanel(); fit(path); kick();
}
pbody.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { const t = N[go.dataset.go]; if (state.tracing && state.selected && t !== state.selected) runTrace(state.selected, t); else select(t); return; }
  const f = e.target.closest('[data-focus]'); if (f) { state.focus = +f.dataset.focus; recompute(); renderPanel(); kick(); if (state.focus) fit([...focusSet]); return; }
  if (e.target.id === 'traceBtn') { state.tracing = !state.tracing; renderPanel(); if (state.tracing) { q.value = ''; q.placeholder = `Trace from ${state.selected.name} to…`; q.focus(); } else q.placeholder = PH; return; }
  if (e.target.id === 'endTrace') { const a = state.trace.from; state.trace = null; select(a); return; }
  if (e.target.id === 'copy') { const t = e.target; navigator.clipboard?.writeText(state.selected.id).then(() => t.textContent = 'Copied', () => t.textContent = 'Select it'); }
});
pbody.addEventListener('pointerover', e => { const r = e.target.closest('[data-l]'); const l = r ? links[+r.dataset.l] : null; if (l !== state.hoverLink) { state.hoverLink = l; kick(); } });
pbody.addEventListener('pointerleave', () => { state.hoverLink = null; kick(); });

// ---------- search ----------
const q = document.getElementById('q'), results = document.getElementById('results'), PH = q.placeholder;
let hits = [], hi = 0;
function search(text) {
  const s = text.trim().toLowerCase(); if (!s) return [];
  return nodes.map(n => {
    let sc = 0;
    if (n.name.toLowerCase().startsWith(s)) sc = 100; else if (n.name.toLowerCase().includes(s)) sc = 80;
    else if (n.id.toLowerCase().includes(s)) sc = 60;
    else if (n.symbols.some(x => x.toLowerCase().includes(s))) sc = 40;
    else if ((n.purpose + ' ' + n.role).toLowerCase().includes(s)) sc = 25;
    return { n, sc: sc ? sc + n.degree / 100 : 0 };
  }).filter(x => x.sc).sort((a, b) => b.sc - a.sc).slice(0, 8).map(x => x.n);
}
function renderResults() {
  if (!hits.length) { results.hidden = true; return; }
  results.hidden = false;
  results.innerHTML = (state.tracing ? `<li class="r-mode">Trace to</li>` : '') + hits.map((n, i) => `<li><button type="button" role="option" data-i="${i}" aria-selected="${i === hi}"><span class="r-name">${esc(n.name)}</span><span class="r-path">${esc(n.id)} · ${esc(n.role)}</span></button></li>`).join('');
}
function pick(n) {
  results.hidden = true; q.value = ''; q.placeholder = PH; q.blur();
  if (state.tracing && state.selected && n !== state.selected) runTrace(state.selected, n); else select(n);
}
q.addEventListener('input', () => { hits = search(q.value); hi = 0; renderResults(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'Enter' && hits[hi]) pick(hits[hi]);
  else if (e.key === 'Escape') { q.value = ''; hits = []; renderResults(); q.blur(); }
});
results.addEventListener('mousedown', e => { const b = e.target.closest('[data-i]'); if (b) { e.preventDefault(); pick(hits[+b.dataset.i]); } });
q.addEventListener('blur', () => setTimeout(() => results.hidden = true, 120));
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  else if (e.key === 'Escape' && document.activeElement !== q) clearSelection();
});

// ---------- filters & tools ----------
const kindsEl = document.getElementById('kinds'), groupsEl = document.getElementById('groups');
const kc = {}; links.forEach(l => Object.keys(l.kinds).forEach(k => kc[k] = (kc[k] || 0) + 1));
KINDS.filter(k => kc[k.id]).forEach(k => kindsEl.insertAdjacentHTML('beforeend', `<button class="chip" type="button" data-kind="${k.id}" aria-pressed="true" style="--c:${k.color}"><i></i>${k.label}<b>${kc[k.id]}</b></button>`));
groups.forEach(g => groupsEl.insertAdjacentHTML('beforeend', `<button class="chip" type="button" data-group="${esc(g.id)}" aria-pressed="true" style="--c:${g.color}" title="Double-click to show only this folder"><i></i>${esc(g.label)}<b>${g.count}</b></button>`));
function toggle(set, id, btn) { set.has(id) ? set.delete(id) : set.add(id); btn.setAttribute('aria-pressed', set.has(id)); }
kindsEl.addEventListener('click', e => { const b = e.target.closest('[data-kind]'); if (!b) return; toggle(state.kinds, b.dataset.kind, b); recompute(); renderPanel(); kick(); });
groupsEl.addEventListener('click', e => { const b = e.target.closest('[data-group]'); if (!b) return; toggle(state.groups, b.dataset.group, b); if (state.selected && !state.groups.has(state.selected.group)) clearSelection(); recompute(); renderPanel(); kick(); });
groupsEl.addEventListener('dblclick', e => {
  const b = e.target.closest('[data-group]'); if (!b) return;
  const only = state.groups.size === 1 && state.groups.has(b.dataset.group);
  state.groups = new Set(only ? groups.map(g => g.id) : [b.dataset.group]);
  groupsEl.querySelectorAll('[data-group]').forEach(x => x.setAttribute('aria-pressed', state.groups.has(x.dataset.group)));
  recompute(); renderPanel(); fit(); kick();
});
const pulseBtn = document.getElementById('pulse'), labelBtn = document.getElementById('labels');
function syncTools() {
  pulseBtn.textContent = { fire: 'Nerves: firing', calm: 'Nerves: calm', off: 'Nerves: still' }[state.mode];
  labelBtn.setAttribute('aria-pressed', state.allLabels); labelBtn.textContent = state.allLabels ? 'Auto labels' : 'All labels';
}
pulseBtn.onclick = () => { state.mode = { fire: 'calm', calm: 'off', off: 'fire' }[state.mode]; store.set('mode', state.mode); syncTools(); kick(); };
labelBtn.onclick = () => { state.allLabels = !state.allLabels; store.set('labels', state.allLabels ? 'all' : 'auto'); syncTools(); kick(); };
document.getElementById('fit').onclick = () => fit(state.selected && focusSet ? [...focusSet] : null);
const panel = document.getElementById('panel'), grab = document.getElementById('grab');
function openSheet(open) { panel.classList.toggle('collapsed', !open); grab.setAttribute('aria-expanded', open); }
grab.onclick = () => openSheet(panel.classList.contains('collapsed'));

document.getElementById('meta').textContent =
  `${nodes.length} files · ${links.length} links · ${groups.length} folders${DATA.commit ? ' · commit ' + DATA.commit : ''} · built ${DATA.generated}`;

syncTools(); renderPanel(); recompute();
new ResizeObserver(resize).observe(stage);
resize(); fit(null, 0);
})();
</script>

</body></html>
